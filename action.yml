name: 'bomhound'
description: 'Enrich Software Bill of Materials (SBOMs) with verified copyright, provenance, and legal attribution notices'
author: 'bonjoski'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  sbom:
    description: 'Path to SBOM file or directory to enrich'
    required: false
    default: '.'
  output_dir:
    description: 'Output directory for enriched SBOMs'
    required: false
    default: 'output'
  in_place:
    description: 'Overwrite input SBOM file in-place'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub token for API access'
    required: false
    default: ${{ github.token }}
  concurrency:
    description: 'Worker concurrency'
    required: false
    default: '5'

runs:
  using: 'composite'
  steps:
    - name: Run bomhound
      shell: bash
      env:
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_OUTPUT_DIR: ${{ inputs.output_dir }}
        INPUT_IN_PLACE: ${{ inputs.in_place }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
      run: |
        set -euo pipefail
        ARGS=(--output-dir "$INPUT_OUTPUT_DIR" --concurrency "$INPUT_CONCURRENCY")
        if [ "$INPUT_IN_PLACE" = "true" ]; then
          ARGS+=(--in-place)
        fi
        ARGS+=(-- "$INPUT_SBOM")
        if [ -n "$INPUT_GITHUB_TOKEN" ]; then
          printf '%s' "$INPUT_GITHUB_TOKEN" | bomhound --token-stdin "${ARGS[@]}"
        else
          bomhound "${ARGS[@]}"
        fi
