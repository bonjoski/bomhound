name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26'
          check-latest: true
          cache: true

      - name: Run Tests with Coverage
        run: make test

      - name: Build Binary
        run: make build

      - name: Run Vulnerability Scan
        run: make vulncheck
