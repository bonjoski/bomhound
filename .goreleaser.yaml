# GoReleaser configuration for bomhound
version: 2

project_name: bomhound

before:
  hooks:
    - go mod tidy

builds:
  - id: bomhound
    main: ./cmd/bomhound/main.go
    binary: bomhound
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/bonjoski/bomhound/pkg/bomhound.Version={{.Version}} -X github.com/bonjoski/bomhound/pkg/bomhound.GitCommit={{.Commit}} -X github.com/bonjoski/bomhound/pkg/bomhound.BuildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - id: cosign
    artifacts: checksum
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
